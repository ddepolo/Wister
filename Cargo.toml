[workspace]
resolver = "2"
members = ["crates/wister-core", "crates/wister-cli", "src-tauri"]

[workspace.package]
version = "0.4.0-beta.1"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/ddepolo/Wister"

# En desarrollo, las dependencias (rubato, cpal, whisper-rs...) se compilan optimizadas:
# sin esto el remuestreo en debug suma cientos de ms a cada dictado.
[profile.dev.package."*"]
opt-level = 3

# Los genéricos de rubato se instancian en wister-core, así que también va optimizado.
[profile.dev.package.wister-core]
opt-level = 3
